name: Test

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  verify:
    name: Typecheck, tests, and UI regression
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libxi-dev libxext-dev libgl1-mesa-dev

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Type check
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: UI smoke tests
        env:
          CI: true
        run: npm run test:ui:smoke

      - name: UI sensitive regression tests
        env:
          CI: true
        run: npm run test:ui:sensitive